<div class="register-container">

  <div class="register-card">

    <div class="register-header">
      <h2>Create User</h2>
      <p>Register a new system user</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

      <!-- First Name -->
      <div class="form-group">
        <label>First Name</label>

        <div class="input-wrapper">
          <i class="bi bi-person"></i>
          <input type="text" formControlName="firstName" placeholder="Enter first name" />
        </div>

        <small class="text-danger"
               *ngIf="registerForm.get('firstName')?.touched &&
                 registerForm.get('firstName')?.errors?.['required']">
          First name is required
        </small>
      </div>

      <!-- Last Name -->
      <div class="form-group">
        <label>Last Name</label>

        <div class="input-wrapper">
          <i class="bi bi-person"></i>
          <input type="text" formControlName="lastName" placeholder="Enter last name" />
        </div>

        <small class="text-danger"
               *ngIf="registerForm.get('lastName')?.touched &&
                 registerForm.get('lastName')?.errors?.['required']">
          Last name is required
        </small>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label>Email</label>

        <div class="input-wrapper">
          <i class="bi bi-envelope"></i>
          <input type="email" formControlName="email" placeholder="Enter email" />
        </div>

        <small class="text-danger"
               *ngIf="registerForm.get('email')?.touched &&
                 registerForm.get('email')?.errors?.['required']">
          Email is required
        </small>

        <small class="text-danger"
               *ngIf="registerForm.get('email')?.touched &&
                 registerForm.get('email')?.errors?.['email']">
          Invalid email format
        </small>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label>Password</label>

        <div class="input-wrapper">
          <i class="bi bi-lock"></i>
          <input type="password" formControlName="password" placeholder="Enter password" />
        </div>

        <small class="text-danger"
               *ngIf="registerForm.get('password')?.touched &&
                 registerForm.get('password')?.errors?.['required']">
          Password is required
        </small>

        <small class="text-danger"
               *ngIf="registerForm.get('password')?.touched &&
                 registerForm.get('password')?.errors?.['minlength']">
          Minimum 3 characters required
        </small>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn-primary">
        <i class="bi bi-person-plus"></i>
        Register User
      </button>

    </form>

  </div>

</div>

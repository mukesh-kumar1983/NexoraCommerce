<div class="user-menu">

  <button class="user-trigger" (click)="toggleDropdown()">

    <img [src]="avatarUrl" class="avatar"  title="Mukesh Kumar Soni" />

    <span class="username"  title="Mukesh Kumar Soni">Mukesh Kumar Soni</span>

  </button>

  @if (isDropdownOpen) {
  <div class="dropdown">

    <a routerLink="/profile" class="dropdown-item">
      <i class="bi bi-person"></i>
      Profile
    </a>

    <!-- NEW: Register User -->
    <a class="dropdown-item"
       (click)="goToRegister($event)">
      <i class="bi bi-person-plus"></i>
      Register User
    </a>

    <a routerLink="/settings/change-password" class="dropdown-item">
      <i class="bi bi-key"></i>
      Change Password
    </a>

    <a routerLink="/settings" class="dropdown-item">
      <i class="bi bi-gear"></i>
      Settings
    </a>

    <div class="divider"></div>

    <button class="dropdown-item logout">
      <i class="bi bi-box-arrow-right"></i>
      Logout
    </button>

  </div>
  }

</div>
